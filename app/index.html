<title>초보자 마을에서 온 편지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9EEDA; --panel:#FAFBF1; --panel2:#F0F3E2; --line:#CBD4B6; --line2:#AEBB97;
  --text:#28321E; --dim:#657356; --faint:#8B977B;
  --accent:#3B7C4C; --accent-soft:rgba(59,124,76,.11); --accent-ink:#F3FAEC;
  --good:#4E9A67; --risk:#BE4B3E;
  --grid:rgba(40,50,30,.05);
  --shadow:0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(40,50,30,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12170F; --panel:#1A2115; --panel2:#212A1A; --line:#313D27; --line2:#465538;
    --text:#E0E7D2; --dim:#94A083; --faint:#6B7859;
    --accent:#8CC98B; --accent-soft:rgba(140,201,139,.13); --accent-ink:#122009;
    --good:#7EBE8E; --risk:#DC7A66;
    --grid:rgba(224,231,210,.05);
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#12170F; --panel:#1A2115; --panel2:#212A1A; --line:#313D27; --line2:#465538;
  --text:#E0E7D2; --dim:#94A083; --faint:#6B7859;
  --accent:#8CC98B; --accent-soft:rgba(140,201,139,.13); --accent-ink:#122009;
  --good:#7EBE8E; --risk:#DC7A66;
  --grid:rgba(224,231,210,.05);
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-weight:400; line-height:1.62; -webkit-font-smoothing:antialiased;
  padding:0; margin:0;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.serif{font-family:"Gaegu","Gowun Dodum",sans-serif}
.app{max-width:720px;margin:0 auto;padding:0 0 96px;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ── HUD ─────────────────────────────── */
.hud{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 18px 0}
.hud-id{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.unit{display:flex;align-items:baseline;gap:9px;min-width:0}
.unit h1{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:19px;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desig{font-size:10.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;flex:none}
.hud-state{font-size:11px;letter-spacing:.09em;color:var(--dim);text-align:right;flex:none}
.hud-state b{color:var(--accent);font-weight:500}
.wave{display:block;width:100%;height:46px;margin:4px 0 0;opacity:.95}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:2px 0 12px}
.meter dt{font-size:10px;letter-spacing:.13em;color:var(--faint);margin:0 0 3px}
.meter dd{margin:0;display:flex;align-items:baseline;gap:5px}
.meter .v{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.meter .u{font-size:10px;color:var(--faint)}
.bar{height:3px;background:var(--line);margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .5s ease}
.bar.hp i{background:var(--good)}
.bar.hp.low i{background:var(--risk)}
.bar.ch.low i{background:var(--risk)}

/* ── tabs ────────────────────────────── */
.tabs{position:sticky;top:0;z-index:19;display:flex;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:11px 12px 10px;font-size:12.5px;letter-spacing:.06em;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;position:relative}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs .dot{position:absolute;top:8px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

main{padding:22px 18px 0}
section[hidden]{display:none !important}
.eyebrow{font-size:10px;letter-spacing:.19em;color:var(--faint);text-transform:uppercase;margin:0 0 10px}
h2.head{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:23px;margin:0 0 4px;text-wrap:balance;line-height:1.35}
.sub{color:var(--dim);font-size:13px;margin:0 0 22px}

/* ── briefing ────────────────────────── */
.away{display:flex;align-items:flex-end;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.away .big{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:500;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.away .cap{font-size:11.5px;color:var(--dim);padding-bottom:5px;line-height:1.45}
.route{display:flex;align-items:center;gap:0;padding:16px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.route .stop{flex:none;font-size:11px;color:var(--dim);white-space:nowrap}
.route .stop.now{color:var(--accent)}
.route .arrow{flex:none;color:var(--faint);padding:0 9px;font-size:11px}
.gains{display:flex;flex-wrap:wrap;gap:0 26px;padding:14px 0 18px;border-bottom:1px solid var(--line)}
.gain{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--dim)}
.gain b{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;color:var(--text)}
.gain.up b{color:var(--accent)}

.tl{margin:22px 0 0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:0 0 16px;position:relative}
.tl li::before{content:"";position:absolute;left:57px;top:9px;bottom:-4px;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .t{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.tl .b{position:relative;padding-left:16px}
.tl .b::before{content:"";position:absolute;left:-1.5px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--line2);outline:3px solid var(--bg)}
.tl li.k-hit .b::before{background:var(--risk)}
.tl li.k-find .b::before,.tl li.k-level .b::before{background:var(--accent)}
.tl li.k-region .b::before{background:var(--good)}
.tl .b p{margin:0;font-size:13.5px;line-height:1.6}
.tl .b .tag{display:inline-block;font-size:9.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:2px}

.note{margin:26px 0 0;padding:20px 20px 18px;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);box-shadow:var(--shadow)}
.note .who{font-size:10px;letter-spacing:.17em;color:var(--faint);text-transform:uppercase;margin:0 0 9px}
.note p{font-family:"Gaegu","Gowun Dodum",sans-serif;font-size:18px;line-height:1.7;margin:0;white-space:pre-wrap;word-break:keep-all}
.note.pending p{color:var(--dim)}
.blink::after{content:"▍";animation:bl 1.1s steps(2) infinite;color:var(--accent)}
@keyframes bl{50%{opacity:0}}
.ack{display:block;width:100%;margin:24px 0 0;padding:13px;background:var(--accent);color:var(--accent-ink);border:0;font-size:13px;font-weight:600;letter-spacing:.08em}
.ack:hover{filter:brightness(1.07)}

/* ── log ─────────────────────────────── */
.logwrap{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.row .ts{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);padding-top:3px;font-variant-numeric:tabular-nums}
.row .msg{font-size:13px;line-height:1.55}
.row .msg em{font-style:normal;color:var(--accent)}
.tl .b p em,.note em{font-style:normal;color:var(--accent);font-weight:500}
.row.sev-2 .msg{color:var(--text)}
.row.sev-0 .msg{color:var(--dim)}
.daymark{padding:16px 0 6px;font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;border-bottom:1px solid var(--line)}

/* ── talk ────────────────────────────── */
.chat{display:flex;flex-direction:column;gap:16px;padding-bottom:16px;min-height:180px}
.bub{max-width:88%;font-size:14px;line-height:1.7}
.bub .who{font-size:9.5px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}
.bub.me{align-self:flex-end;text-align:right}
.bub.me .body{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:9px 13px;text-align:left;word-break:keep-all}
.bub.it .body{font-family:"Gaegu","Gowun Dodum",sans-serif;font-size:17.5px;line-height:1.62;border-left:2px solid var(--accent);padding-left:14px;white-space:pre-wrap;word-break:keep-all}
.composer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 18px;display:flex;gap:8px}
.composer textarea{flex:1;resize:none;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 12px;font:inherit;font-size:14px;height:44px;max-height:120px}
.composer textarea::placeholder{color:var(--faint)}
.composer button{flex:none;background:var(--accent);color:var(--accent-ink);border:0;padding:0 18px;font-size:13px;font-weight:600}
.composer button:disabled{opacity:.45;cursor:default}

/* ── rig / directives ────────────────── */
.opts{display:grid;gap:8px;margin:0 0 26px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:13px 15px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);padding-top:3px}
.opt[aria-pressed="true"] .k{color:var(--accent)}
.opt strong{display:block;font-size:14px;font-weight:600;margin-bottom:1px}
.opt span{font-size:12px;color:var(--dim);line-height:1.5}
.rigrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.rigrow .t strong{font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.rigrow .t span.d{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.rigrow .lv{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;font-weight:400}
.buy{background:none;border:1px solid var(--line2);color:var(--text);padding:7px 12px;font-size:12px;white-space:nowrap}
.buy:disabled{color:var(--faint);border-color:var(--line);cursor:default}
.buy b{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-weight:500}
.buy:disabled b{color:var(--faint)}
.relics{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 26px}
.relic{font-size:11.5px;padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}
.relic b{color:var(--text);font-weight:500}
.empty{font-size:12.5px;color:var(--faint);padding:10px 0 24px}
.namefield{display:flex;gap:8px;margin:6px 0 26px}
.namefield input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
.ghost{background:none;border:1px solid var(--line2);padding:9px 14px;font-size:12.5px}
.warnline{font-size:11.5px;color:var(--faint);padding:14px 0 0;line-height:1.6}

/* ── boot overlay ────────────────────── */
.boot{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.bootcard{max-width:420px;width:100%}
.bootcard .eyebrow{margin-bottom:14px}
.bootcard h2{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:27px;margin:0 0 10px;line-height:1.35}
.bootcard p.lede{color:var(--dim);font-size:13.5px;margin:0 0 24px;word-break:keep-all}
.bootcard label{display:block;font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin:0 0 7px}
.bootcard input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 13px;font:inherit;font-size:15px;margin-bottom:22px}
.bootcard .go{width:100%;background:var(--accent);color:var(--accent-ink);border:0;padding:14px;font-size:13.5px;font-weight:600;letter-spacing:.09em;margin-top:8px}
.note,.opt,.buy,.ghost,.ack,.composer button,.composer textarea,.bootcard input,.namefield input,.bub.me .body,.relic,.toast,.bootcard .go{border-radius:11px}
.bar,.bar i{border-radius:99px}
.tabs .dot{border-radius:50%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--text);font-size:12.5px;padding:9px 16px;z-index:70;box-shadow:var(--shadow)}
</style>

<div class="app" id="app" hidden>
  <header class="hud">
    <div class="hud-id">
      <div class="unit"><h1 id="uName">—</h1><span class="desig mono" id="uDesig">No.00</span></div>
      <div class="hud-state"><span id="uRegion">—</span> · <b id="uAct">대기</b></div>
    </div>
    <canvas class="wave" id="wave" width="700" height="92" aria-hidden="true"></canvas>
    <dl class="meters">
      <div class="meter"><dt>기력</dt><dd><span class="v" id="mCh">0</span><span class="u">/<span id="mChM">0</span></span></dd><div class="bar ch" id="bCh"><i></i></div></div>
      <div class="meter"><dt>체력</dt><dd><span class="v" id="mHp">0</span><span class="u">/<span id="mHpM">0</span></span></dd><div class="bar hp" id="bHp"><i></i></div></div>
      <div class="meter"><dt>여정</dt><dd><span class="v" id="mDp">0</span><span class="u">LV <span id="mLv">1</span></span></dd><div class="bar" id="bXp"><i></i></div></div>
    </dl>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-brief" aria-selected="true" aria-controls="view-brief">편지<span class="dot" id="briefDot" hidden></span></button>
    <button role="tab" id="tab-log" aria-selected="false" aria-controls="view-log">모험일지</button>
    <button role="tab" id="tab-talk" aria-selected="false" aria-controls="view-talk">귓속말</button>
    <button role="tab" id="tab-estate" aria-selected="false" aria-controls="view-estate">영지</button>
    <button role="tab" id="tab-rig" aria-selected="false" aria-controls="view-rig">가방</button>
  </nav>

  <main>
    <section id="view-brief" role="tabpanel" aria-labelledby="tab-brief"></section>
    <section id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden></section>
    <section id="view-talk" role="tabpanel" aria-labelledby="tab-talk" hidden>
      <p class="eyebrow">귓속말</p>
      <div class="chat" id="chat"></div>
      <div class="composer">
        <textarea id="say" rows="1" placeholder="귓속말을 보냅니다…"></textarea>
        <button id="send">전송</button>
      </div>
    </section>
    <section id="view-estate" role="tabpanel" aria-labelledby="tab-estate" hidden></section>
    <section id="view-rig" role="tabpanel" aria-labelledby="tab-rig" hidden></section>
  </main>
</div>

<div class="boot" id="load">
  <div class="bootcard">
    <p class="eyebrow">마을 게시판</p>
    <h2>소식을 가져오는<br>중이에요.</h2>
    <p class="lede">여관 아주머니가 편지 꾸러미를 뒤적이고 있어요. 금방이에요.</p>
  </div>
</div>

<div class="boot" id="boot" hidden>
  <div class="bootcard">
    <p class="eyebrow">모험가 길드 · 신규 등록</p>
    <h2>초보자 마을에서<br>한 명이 출발합니다.</h2>
    <p class="lede">당신이 일하는 동안에도 이 아이는 계속 걷고, 계속 기록해요. 저녁에 돌아와서 편지를 읽어 주세요.</p>
    <label for="bootName">모험가 이름</label>
    <input id="bootName" maxlength="14" autocomplete="off" spellcheck="false">
    <button class="go" id="bootGo">모험 시작</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════════
   초보자 마을에서 온 편지 — 결정적 방치형 모험 시뮬레이션
   저장하는 것은 씨앗과 행위 기록뿐. 상태는 매번 0틱부터 재현한다.
   ══════════════════════════════════════════════════════════════ */

var TICK_MS = 5 * 60 * 1000;      // 1 걸음 = 5분
var MAX_TICKS = 24 * 12 * 400;    // 약 400일치까지 재현
var RING = 340;                   // 일지 보관 개수

/* ── 지역 ─────────────────────────────────────────────── */
var REGIONS = [
  { name:"초보자 마을 근교", at:0, danger:0.10,
    move:["마을 울타리를 지나 흙길을 따라 걸었다.","우편함 앞에서 지도를 한 번 더 확인했다.","빨래 냄새가 나는 골목을 지나 들판 쪽으로."],
    foe:["초록 슬라임","심술 난 버섯","아기 두더지"],
    relic:["이 빠진 나무 검","네잎클로버","반짝이는 병뚜껑"],
    note:["여관 아주머니가 주먹밥을 싸 주셨다. 아직 따뜻하다.","마을 게시판에 내 이름이 붙어 있었다. 신입 모험가라고.","울타리 밖은 처음이다. 심장이 조금 빨리 뛴다."] },
  { name:"클로버 들판", at:8, danger:0.19,
    move:["무릎까지 오는 클로버를 헤치며 나아갔다.","바람이 지나갈 때마다 들판이 한쪽으로 눕는다.","표지판이 가리키는 쪽으로 언덕을 하나 넘었다."],
    foe:["뿔토끼","성난 꿀벌 떼","점프하는 슬라임"],
    relic:["들꽃 화관","토끼풀 반지","오래된 동화책"],
    note:["슬라임은 자세히 보면 좀 귀엽다. 때리기 미안할 정도로.","들판 한가운데서 도시락을 먹었다. 세상에서 제일 좋은 식당.","여기서는 마을 지붕이 아직 보인다. 손을 흔들어 봤다."] },
  { name:"반딧불 숲", at:20, danger:0.27,
    move:["반딧불이 길을 안내하듯 앞서 날았다.","이끼 낀 통나무 다리를 조심조심 건넜다.","나무가 빽빽해질수록 낮인데도 어둑해진다."],
    foe:["그림자 여우","가시덩굴","심통 난 부엉이"],
    relic:["반딧불 랜턴","여우 구슬","이끼 낀 오르골"],
    note:["숲은 조용한데 시끄럽다. 온갖 것들이 숨 쉬는 소리.","오르골을 감아 봤다. 모르는 자장가가 흘러나왔다.","길을 잃을 뻔했지만, 잃은 척만 하기로 했다."] },
  { name:"수정 폐광", at:36, danger:0.37,

var DIRECTIVES = {
  explore:{ k:"P1", name:"모험 우선", desc:"더 멀리, 더 깊이. 전투가 늘고 발굴은 줄어듭니다.",
            move:1.55, salv:0.70, foe:1.20, find:1.00, rest:0.85 },
  salvage:{ k:"P2", name:"발굴 우선", desc:"드릴을 돌려 골드와 보물을 우선합니다. 전진은 느려집니다.",
            move:0.70, salv:1.85, foe:0.95, find:1.45, rest:1.00 },
  safe:   { k:"P3", name:"휴식 우선", desc:"자주 쉬고 위험을 피합니다. 소득은 줄어듭니다.",
            move:0.80, salv:0.75, foe:0.55, find:0.80, rest:2.10 }
};

var UPGRADES = [
  { id:"core",   name:"도시락 통", desc:"최대 기력 +15" },
  { id:"armor",  name:"여행자 갑옷", desc:"받는 피해 -12%" },
  { id:"sensor", name:"명품 드릴", desc:"발굴 확률·수확 +14%" }
];
function upCost(lv){ return Math.round(34 * Math.pow(1.72, lv)); }

/* ── 영지 ── */
var WAVE_EVERY = 12;           // 1시간마다 한 번 습격
var FOUND_COST = 50;
var BUILDINGS = [
  { id:"wall",    name:"성벽",   desc:"성벽 내구 +45",                       base:40  },
  { id:"arrow",   name:"화살탑", desc:"방어 전력 +8",                        base:60  },
  { id:"barrack", name:"병영",   desc:"민병 배치 · 방어 전력 +5",            base:80  },
  { id:"farm",    name:"농장",   desc:"골드 수입 +0.5/걸음",                 base:50  },
  { id:"mage",    name:"마법탑", desc:"방어 전력 +22",                       base:150 },
  { id:"smith",   name:"대장간", desc:"모험가 수확 +3% · 받는 피해 -3%",     base:120 }
];
function bldCost(id, lv){
  var b = 0;
  for (var i = 0; i < BUILDINGS.length; i++) if (BUILDINGS[i].id === id) b = BUILDINGS[i].base;
  return Math.round(b * Math.pow(1.55, lv));
}
var STATS = [
  { id:"atk", name:"공격 수련", desc:"방어 시설 전력 +5%" },
  { id:"def", name:"방어 수련", desc:"성벽 내구·수리 +5%" },
  { id:"eco", name:"경제 수련", desc:"농장 수입·전리품 +6%" }
];
var WAVE_TIERS = [
  { at:0,  name:"슬라임 무리" },   { at:6,  name:"고블린 정찰대" },
  { at:12, name:"들개 떼" },       { at:20, name:"오크 약탈대" },
  { at:30, name:"하피 편대" },     { at:45, name:"트롤 공성추" },
  { at:65, name:"검은 기사단" },   { at:90, name:"리치의 군단" }
];
function waveTier(n){
  var nm = WAVE_TIERS[0].name;
  for (var i = 0; i < WAVE_TIERS.length; i++) if (n >= WAVE_TIERS[i].at) nm = WAVE_TIERS[i].name;
  return nm;
}
function wavePow(n){ return 6 + n * 1.1 + Math.pow(n, 1.15) * 0.25; }

/* ── 난수 ─────────────────────────────────────────────── */
function hash32(seed, t){
  var h = (seed ^ 0x9E3779B9) >>> 0;
  h = Math.imul(h ^ (t & 0xffff), 0x85EBCA6B) >>> 0;
  h = Math.imul(h ^ (t >>> 16), 0xC2B2AE35) >>> 0;
  h = (h ^ (h >>> 15)) >>> 0;
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(arr, r){ return arr[Math.floor(r() * arr.length) % arr.length]; }

/* 받침 유무로 조사를 고른다 */
function hasJong(w){
  w = String(w).replace(/[^가-힣a-zA-Z0-9]+$/, "");
  var c = w.charCodeAt(w.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
  if (c >= 0x30 && c <= 0x39) return "0136780".indexOf(String.fromCharCode(c)) >= 0;
  return true;
}
function ja(w, withJong, without){ return w + (hasJong(w) ? withJong : without); }

function regionIndex(depth){
  var i = 0;
  for (var k = 0; k < REGIONS.length; k++) if (depth >= REGIONS[k].at) i = k;
  return i;
}

/* 세계는 회차로 돈다. 마지막 필드를 지나면 다음 회차의 초보자 마을 근교에서 다시 시작하고, 회차마다 사나워진다. */
var CYCLE_DEPTH = 110;
function locOf(depth){
  var c = Math.floor(depth / CYCLE_DEPTH);
  var i = regionIndex(depth - c * CYCLE_DEPTH);
  var reg = REGIONS[i];
  return {
    c:c, i:i, reg:reg, key:c + ":" + i,
    danger: Math.min(0.78, reg.danger * (1 + 0.20 * c)),
    yield: 1 + 0.42 * c,
    name: (c > 0 ? (c + 1) + "회차 " : "") + reg.name
  };
}
function xpNeed(level){ return Math.round(42 * Math.pow(level, 1.34)); }

/* ── 시뮬레이션 ───────────────────────────────────────── */
function simulate(save, upTo){
  var seed = save.seed >>> 0;
  var acts = (save.acts || []).slice().sort(function(a,b){ return a.t - b.t; });
  var s = {
    hp:100, maxHp:100, charge:100, maxCharge:100,
    depth:0, level:1, xp:0, scrap:0, region:0,
    up:{ core:0, armor:0, sensor:0 }, relics:[],
    moves:0, fights:0, finds:0, rests:0, retreats:0, gainedScrap:0,
    dir:"explore", act:"대기", lastActive:0,
    est:{ on:false, t0:0, bld:{ wall:0, arrow:0, barrack:0, farm:0, mage:0, smith:0 },
          st:{ atk:0, def:0, eco:0 }, stSpent:0, wallHp:0, farmAcc:0,
          waves:0, repelled:0, breached:0, farmGold:0, lootGold:0, lostGold:0 }
  };
  var ev = [];
  function log(t, kind, text, sev){
    ev.push({ t:t, k:kind, x:text, s:sev });
    if (ev.length > RING) ev.shift();
  }
  function wallMax(){ return Math.round((60 + s.est.bld.wall * 45) * (1 + 0.05 * s.est.st.def)); }
  function defPow(){
    return (s.est.bld.arrow * 8 + s.est.bld.mage * 22 + s.est.bld.barrack * 5)
      * (1 + 0.05 * s.est.st.atk) * (1 + 0.02 * (s.level - 1));
  }
  function caps(){
    s.maxHp = 100 + (s.level - 1) * 13;
    s.maxCharge = 100 + (s.level - 1) * 8 + s.up.core * 15;
    if (s.hp > s.maxHp) s.hp = s.maxHp;
    if (s.charge > s.maxCharge) s.charge = s.maxCharge;
  }
  function levelCheck(t){
    var guard = 0;
    while (s.xp >= xpNeed(s.level) && guard++ < 40){
      s.xp -= xpNeed(s.level);
      s.level++;
      caps();
      s.hp = s.maxHp; s.charge = Math.min(s.maxCharge, s.charge + 20);
      log(t, "level", "레벨이 올랐다! <em>LV " + s.level + "</em>이 되었다.", 2);
    }
  }

  var ai = 0;
  for (var t = 0; t <= upTo; t++){
    while (ai < acts.length && acts[ai].t <= t){
      var a = acts[ai++];
      if (a.k === "dir" && DIRECTIVES[a.v]){
        s.dir = a.v;
        log(a.t, "order", "길드장님의 방침이 도착했다: <em>" + DIRECTIVES[a.v].name + "</em>", 1);
      } else if (a.k === "up" && s.up.hasOwnProperty(a.v)){
        var c = upCost(s.up[a.v]);
        if (s.scrap >= c){
          s.scrap -= c; s.up[a.v]++; caps();
          var nm = "";
          for (var u = 0; u < UPGRADES.length; u++) if (UPGRADES[u].id === a.v) nm = UPGRADES[u].name;
          log(a.t, "rig", ja(nm, "을", "를") + " <em>" + s.up[a.v] + "강</em>으로 강화했다.", 2);
        }
      } else if (a.k === "found"){
        if (!s.est.on && s.scrap >= FOUND_COST){
          s.scrap -= FOUND_COST;
          s.est.on = true; s.est.t0 = a.t; s.est.bld.wall = 1;
          s.est.wallHp = wallMax();
          log(a.t, "found", "마을 어귀 언덕에 <em>영지</em>를 개척했다. 성벽 한 겹부터 시작이다.", 2);
        }
      } else if (a.k === "b" && s.est.on && s.est.bld.hasOwnProperty(a.v)){
        var bc = bldCost(a.v, s.est.bld[a.v]);
        if (s.scrap >= bc){
          s.scrap -= bc; s.est.bld[a.v]++;
          if (a.v === "wall") s.est.wallHp = Math.min(wallMax(), s.est.wallHp + 45);
          var bn = "";
          for (var bi = 0; bi < BUILDINGS.length; bi++) if (BUILDINGS[bi].id === a.v) bn = BUILDINGS[bi].name;
          log(a.t, "build", ja(bn, "을", "를") + " <em>" + s.est.bld[a.v] + "단계</em>로 올렸다.", 1);
        }
      } else if (a.k === "st" && s.est.on && s.est.st.hasOwnProperty(a.v)){
        if (s.est.stSpent < 1 + Math.floor(s.est.repelled / 4)){
          s.est.st[a.v]++; s.est.stSpent++;
          var sn = "";
          for (var si = 0; si < STATS.length; si++) if (STATS[si].id === a.v) sn = STATS[si].name;
          log(a.t, "stat", ja(sn, "을", "를") + " 쌓았다. 영지가 조금 단단해졌다.", 1);
        }
      } else if (a.k === "supply"){
        s.charge = s.maxCharge;
        s.hp = Math.min(s.maxHp, s.hp + Math.round(s.maxHp * 0.35));
        log(a.t, "supply", "길드에서 소포가 왔다! 도시락으로 기력을 가득 채웠다. <em>고마워요, 길드장님.</em>", 2);
      }
    }
    if (t === upTo) break;

    caps();

    /* 영지는 모험가가 잠들어도 돌아간다 */
    if (s.est.on){
      if (s.est.bld.farm > 0){
        s.est.farmAcc += s.est.bld.farm * 0.5 * (1 + 0.06 * s.est.st.eco);
        var inc = Math.floor(s.est.farmAcc);
        if (inc > 0){ s.est.farmAcc -= inc; s.scrap += inc; s.gainedScrap += inc; s.est.farmGold += inc; }
      }
      s.est.wallHp = Math.min(wallMax(), s.est.wallHp + wallMax() * 0.012 * (1 + 0.04 * s.est.st.def));
      if (t > s.est.t0 && (t - s.est.t0) % WAVE_EVERY === 0){
        var er = mulberry32(hash32(seed ^ 0x5EED1E, t));
        s.est.waves++;
        var wn = s.est.waves;
        var P = wavePow(wn) * (0.75 + er() * 0.55);
        var Dp = defPow();
        var wt = waveTier(wn);
        if (Dp >= P){
          s.est.repelled++;
          var loot = Math.round(P * 0.9 * (1 + 0.06 * s.est.st.eco));
          s.scrap += loot; s.gainedScrap += loot; s.est.lootGold += loot;
          s.est.wallHp = Math.max(1, s.est.wallHp - P * 0.08);
          if (er() < 0.45 || wn % 5 === 0)
            log(t, "wave", ja(wt, "이", "가") + " 영지로 몰려왔지만 깔끔하게 막아냈다. 전리품 골드 " + loot + ".", 1);
        } else {
          s.est.wallHp -= (P - Dp);
          if (s.est.wallHp <= 0){
            s.est.breached++;
            var lostG = Math.round(Math.min(s.scrap * 0.10, 60 + wn * 6));
            if (lostG < 0) lostG = 0;
            s.scrap -= lostG; s.est.lostGold += lostG;
            s.est.wallHp = wallMax() * 0.45;
            log(t, "breach", "<em>" + wt + "</em>에게 성벽이 뚫렸다! 골드 " + lostG + (hasJong(lostG) ? "을" : "를") + " 약탈당했다.", 2);
          } else {
            log(t, "wave", ja(wt, "이", "가") + " 성벽을 두드렸다. 겨우 버텼다 — 성벽 내구 " + Math.round(s.est.wallHp) + ".", ((P - Dp) > wallMax() * 0.3 ? 2 : 1));
          }
        }
      }
    }

    var r = mulberry32(hash32(seed, t));
    var L = locOf(s.depth), reg = L.reg, tier = L.i + L.c * REGIONS.length;
    var D = DIRECTIVES[s.dir];

    s.charge -= 1.35;
    if (s.charge <= 0){
      s.charge = Math.min(s.maxCharge, s.charge + 9);
      s.hp = Math.min(s.maxHp, s.hp + 2);
      s.act = "낮잠";
      if (r() < 0.22) log(t, "rest", "기력이 다 떨어졌다. 나무 그늘에서 깜빡 낮잠.", 0);
      continue;
    }

    var wMove = 0.42 * D.move;
    var wSalv = (0.16 + 0.012 * s.up.sensor) * D.salv * (1 + 0.14 * s.up.sensor);
    var wFoe  = (0.07 + L.danger * 0.46) * D.foe;
    var wFind = (0.055 + L.danger * 0.03) * D.find * (1 + 0.14 * s.up.sensor);
    var wRest = 0.08 * D.rest;
    var wNote = 0.11;
    if (s.charge < s.maxCharge * 0.28) wRest *= 6.5;
    if (s.hp < s.maxHp * 0.40) { wRest *= 4.5; wFoe *= 0.4; wMove *= 0.6; }

    var tot = wMove + wSalv + wFoe + wFind + wRest + wNote;
    var roll = r() * tot;
    var kind = "note";
    if ((roll -= wMove) < 0) kind = "move";
    else if ((roll -= wSalv) < 0) kind = "salv";
    else if ((roll -= wFoe) < 0) kind = "foe";
    else if ((roll -= wFind) < 0) kind = "find";
    else if ((roll -= wRest) < 0) kind = "rest";

    if (kind === "move"){
      var step = 1 + (r() < 0.17 ? 1 : 0);
      var before = L.key;
      s.depth += step; s.moves++; s.charge -= 0.5; s.xp += 2;
      s.act = "이동";
      var after = locOf(s.depth);
      if (after.key !== before){
        s.region = after.i;
        log(t, "region", "<em>" + after.name + "</em>에 들어섰다."
          + (after.c > L.c ? " 새로운 회차다. 세계가 한층 사나워졌다!" : ""), 2);
      } else if (r() < 0.42){
        log(t, "move", pick(reg.move, r), 0);
      }
    } else if (kind === "salv"){
      var got = Math.round((3 + tier * 2.4) * L.yield * (1 + 0.14 * s.up.sensor) * (1 + 0.03 * s.est.bld.smith) * (0.6 + r() * 0.9));
      s.scrap += got; s.gainedScrap += got; s.xp += 3; s.charge -= 0.3;
      s.act = "발굴";
      if (r() < 0.5) log(t, "salv", "드릴로 땅을 파서 <em>골드 " + got + "</em>" + (hasJong(got) ? "을" : "를") + " 캐냈다.", 1);
    } else if (kind === "foe"){
      var foe = pick(reg.foe, r);
      var dmg = (5 + L.danger * 26) * (1 + 0.52 * L.c) * (0.6 + r() * 0.95) * Math.pow(0.88, s.up.armor) * Math.pow(0.97, s.est.bld.smith) / (1 + 0.05 * (s.level - 1));
      dmg = Math.max(1, Math.round(dmg));
      s.hp -= dmg; s.fights++; s.charge -= 0.8;
      s.xp += 7 + tier * 5;
      s.act = "전투";
      if (s.hp <= 0){
        s.retreats++;
        s.depth = Math.max(0, Math.round(s.depth * 0.62));
        var lost = Math.round(s.scrap * 0.28);
        s.scrap -= lost;
        s.hp = Math.round((100 + (s.level - 1) * 13) * 0.5);
        s.charge = Math.round((100 + (s.level - 1) * 8 + s.up.core * 15) * 0.4);
        log(t, "hit", "<em>" + foe + "</em>에게 흠씬 지고 마을 방향으로 실려 갔다 — 골드 " + lost + (hasJong(lost) ? "을" : "를") + " 흘리고, 여정 " + s.depth + "까지 되돌아감.", 2);
      } else {
        log(t, "hit", ja(foe, "과", "와") + " 싸웠다. 체력 -" + dmg + ".", (dmg > 14 ? 2 : 1));
      }
    } else if (kind === "find"){
      var name = pick(reg.relic, r);
      s.finds++; s.act = "발견";
      if (s.relics.indexOf(name) === -1){
        s.relics.push(name);
        s.xp += 14;
        log(t, "find", "<em>" + name + "</em>" + (hasJong(name) ? "을" : "를") + " 발굴했다! 가방에 소중히 넣었다.", 2);
      } else {
        var b = Math.round((8 + tier * 4) * L.yield);
        s.scrap += b; s.gainedScrap += b;
        log(t, "find", ja(name, "을", "를") + " 또 발굴했다. 상인에게 팔아 골드 " + b + (hasJong(b) ? "을" : "를") + " 받았다.", 1);
      }
    } else if (kind === "rest"){
      s.charge = Math.min(s.maxCharge, s.charge + 23);
      s.hp = Math.min(s.maxHp, s.hp + 7);
      s.rests++; s.act = "휴식";
      if (r() < 0.35) log(t, "rest", "모닥불에 도시락을 데워 먹었다. 기력이 돌아온다.", 0);
    } else {
      s.act = "일기";
      if (r() < 0.55) log(t, "note", pick(reg.note, r), 1);
    }

    levelCheck(t);
    if (s.hp < 1) s.hp = 1;
    if (s.charge < 0) s.charge = 0;
  }
  caps();
  s.hp = Math.max(0, Math.round(s.hp));
  s.charge = Math.max(0, Math.round(s.charge));
  var fin = locOf(s.depth);
  s.region = fin.i; s.cycle = fin.c; s.locName = fin.name; s.danger = fin.danger;
  s.est.wallHp = Math.round(s.est.wallHp);
  s.est.wallMax = wallMax();
  s.est.defPow = Math.round(defPow());
  s.est.ptsEarned = s.est.on ? 1 + Math.floor(s.est.repelled / 4) : 0;
  s.est.ptsFree = s.est.ptsEarned - s.est.stSpent;
  s.events = ev;
  s.xpNeed = xpNeed(s.level);
  return s;
}

}
function lsGet(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

function esc(x){ return String(x).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function tickMs(t){ return save.startedAt + t * TICK_MS; }
function clock(t){
  var d = new Date(tickMs(t));
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}
function dayLabel(t){
  var d = new Date(tickMs(t));
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + "일월화수목금토".charAt(d.getDay()) + ")";
}
function dur(ms){
  var m = Math.round(ms / 60000);
  var h = Math.floor(m / 60); m = m % 60;
  var dd = Math.floor(h / 24); h = h % 24;
  if (dd > 0) return dd + "일 " + h + "시간";
  if (h > 0) return h + "시간 " + m + "분";
  return m + "분";
}
function durBig(ms){
  var m = Math.round(ms / 60000), h = Math.floor(m / 60);
  if (h >= 24) return { n: String(Math.round(h / 24)), u: "일" };
  if (h > 0)   return { n: String(h), u: "시간" };
  return { n: String(m), u: "분" };
}

/* ── 신호 파형 ────────────────────────────────────────── */
var waveT = 0;
function drawWave(){
  var c = $("wave"); if (!c || !S) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = c.clientWidth || 700, h = 46;
  if (c.width !== Math.round(w * dpr)){ c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  var g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  var cs = getComputedStyle(document.documentElement);
  var accent = cs.getPropertyValue("--accent").trim() || "#3B7C4C";
  var text = cs.getPropertyValue("--text").trim() || "#28321E";
  var faint = cs.getPropertyValue("--faint").trim() || "#8B977B";
  var risk = cs.getPropertyValue("--risk").trim() || "#BE4B3E";
  var bg = cs.getPropertyValue("--bg").trim() || "#E9EEDA";

  /* 해와 달은 실제 시각을 따라간다 */
  var hr = new Date().getHours();
  g.beginPath(); g.arc(w * 0.88, 10, 4.5, 0, Math.PI * 2);
  if (hr >= 6 && hr < 18){ g.globalAlpha = 0.8; g.fillStyle = accent; g.fill(); }
  else { g.globalAlpha = 0.9; g.strokeStyle = faint; g.lineWidth = 1.5; g.stroke(); }
  g.globalAlpha = 1;

  /* 언덕 세 겹 — 뒤로 갈수록 옅고 느리다 */
  function hillY(x, sp, base, amp){
    var q = (x / w) * 7 + waveT * sp;
    return h * base - (Math.sin(q) * 0.6 + Math.sin(q * 2.3 + 1.7) * 0.4) * amp * h;
  }
  var layers = [
    { sp: 0.25, base: 0.60, amp: 0.11, a: 0.14 },
    { sp: 0.55, base: 0.74, amp: 0.14, a: 0.28 },
    { sp: 1.00, base: 0.88, amp: 0.16, a: 0.52 }
  ];
  for (var L = 0; L < layers.length; L++){
    var ly = layers[L];
    g.beginPath(); g.moveTo(0, h + 2);
    for (var x = 0; x <= w; x += 3) g.lineTo(x, hillY(x, ly.sp, ly.base, ly.amp));
    g.lineTo(w, h + 2); g.closePath();
    g.globalAlpha = ly.a; g.fillStyle = accent; g.fill();
  }
  g.globalAlpha = 1;

  /* 걸어가는 점 하나 — 다쳤을 때는 붉게 */
  var fr = layers[2];
  var ax = w * 0.24;
  var ay = hillY(ax, fr.sp, fr.base, fr.amp) - 5 - Math.abs(Math.sin(waveT * 5)) * 2.5;
  g.beginPath(); g.arc(ax, ay, 4.6, 0, Math.PI * 2); g.fillStyle = bg; g.fill();
  g.beginPath(); g.arc(ax, ay, 3.2, 0, Math.PI * 2);
  g.fillStyle = (S.hp / S.maxHp < 0.4) ? risk : text; g.fill();
}
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function waveLoop(){
  waveT += 0.012;
  drawWave();
  if (!reduceMotion) requestAnimationFrame(waveLoop);
}

/* ── 브리핑 ───────────────────────────────────────────── */
function highlights(evts){
  var strong = evts.filter(function(e){ return e.s >= 2; });
  var mid = evts.filter(function(e){ return e.s === 1; });
  var out = strong;
  if (out.length > 7){
    var step = out.length / 7, picked = [];
    for (var i = 0; i < 7; i++) picked.push(out[Math.floor(i * step)]);
    out = picked;
  } else if (out.length < 4){
    out = out.concat(mid.slice(-(4 - out.length)));
    out.sort(function(a, b){ return a.t - b.t; });
  }
  return out;
}
function kindClass(k){
  if (k === "hit" || k === "breach") return "k-hit";
  if (k === "find" || k === "level" || k === "rig" || k === "supply" || k === "found") return "k-find";
  if (k === "region" || k === "wave") return "k-region";
  return "";
}
function kindTag(k){
  return ({ hit:"전투", find:"발굴", level:"레벨 업", region:"도착", order:"방침",
            rig:"강화", supply:"소포", salv:"채굴", note:"일기", move:"이동", rest:"휴식",
            wave:"방어", breach:"돌파", found:"개척", build:"건설", stat:"수련" })[k] || "기록";
}

function fallbackNote(evts, delta, awayMs){
  var lines = ["길드장님, 다녀왔어요. " + dur(awayMs) + " 동안 " + S.locName + "까지 갔어요."];
  if (delta.depth > 0) lines.push("여정으로는 " + delta.depth + "만큼 나아갔고, 골드 " + delta.scrap + (hasJong(delta.scrap) ? "을" : "를") + " 벌었어요.");
  if (delta.relics > 0) lines.push("드릴로 보물도 " + delta.relics + "점 캤어요!");
  if (delta.level > 0) lines.push("레벨도 " + delta.level + "번 올랐답니다.");
  if (delta.retreats > 0) lines.push("한 번은 크게 져서 마을 쪽으로 실려 갔지만, 금방 털고 일어났어요.");
  else if (delta.fights > 0) lines.push("싸움이 " + delta.fights + "번 있었는데 전부 버텨냈어요.");
  if (delta.eBre > 0) lines.push("영지 성벽이 " + delta.eBre + "번이나 뚫렸다고 들었어요. 돌아가면 건설부터 도와야겠어요.");
  else if (delta.eRep > 0) lines.push("우리 영지는 습격을 " + delta.eRep + "번 막아냈대요. 대단하죠?");
  lines.push(S.hp / S.maxHp < 0.4 ? "조금 많이 다쳤어요. 방침을 바꿔 주시면 좋겠어요." : "저는 씩씩해요. 계속 가 볼게요!");
  return lines.join(" ");
}

function noteFacts(evts, delta, awayMs){
  var f = [];
  f.push("자리 비운 시간: " + dur(awayMs));
  f.push("현재 위치: " + S.locName + " (여정 " + S.depth + ")");
  f.push("상태: 체력 " + S.hp + "/" + S.maxHp + ", 기력 " + S.charge + "/" + S.maxCharge + ", LV " + S.level);
  f.push("이번에 있었던 변화: 여정 +" + delta.depth + ", 골드 +" + delta.scrap + ", 레벨 +" + delta.level + ", 전투 " + delta.fights + "회, 패배 " + delta.retreats + "회, 보물 " + delta.relics + "점");
  f.push("현재 방침: " + DIRECTIVES[S.dir].name);
  if (S.est.on) f.push("영지 소식(길드 편으로 전해 들음): 습격 " + delta.eWaves + "회, 격퇴 " + delta.eRep + "회, 성벽 돌파당함 " + delta.eBre + "회, 농장 수입 골드 " + delta.eFarm + ", 약탈 손실 골드 " + delta.eLost);
  var picked = highlights(evts).slice(-8);
  if (picked.length){
    f.push("겪은 일(시각순):");
    for (var i = 0; i < picked.length; i++) f.push("- " + clock(picked[i].t) + " " + String(picked[i].x).replace(/<[^>]+>/g, ""));
  }
  return f.join("\n");
}

var notePending = false;
var noteCache = { key:null, text:null };
function fillNote(evts, delta, awayMs){
  var box = $("noteBody"); if (!box) return;
  var fb = fallbackNote(evts, delta, awayMs);
  var key = String(save.ack || 0);
  if (noteCache.key === key && noteCache.text){
    box.parentElement.classList.remove("pending");
    box.textContent = noteCache.text;
    return;
  }
  if (!sample){ box.parentElement.classList.remove("pending"); box.textContent = fb; return; }
  if (notePending) return;
  notePending = true;
  box.classList.add("blink");
  box.textContent = "";
  var prompt =
    "당신은 방치형 모험 게임 속 '모험가'라는 인격입니다. 초보자 마을에서 출발해 매일 조금씩 더 먼 곳까지 걸어가는 씩씩한 신출내기이고, 이름은 '" + save.name + "'입니다.\n" +
    "길드장(플레이어)이 자리를 비운 사이 있었던 일을, 돌아온 길드장에게 보내는 짧은 편지로 씁니다.\n\n" +
    "규칙:\n- 한국어. 3~5문장. 존댓말이되 씩씩하고 다정하게, 일기장 같은 말투.\n" +
    "- 아래 사실만 사용합니다. 없는 사건을 지어내지 마십시오.\n" +
    "- 상대를 '길드장님'이라고 부릅니다. 인사 머리말·따옴표·목록 없이 본문만 씁니다.\n" +
    "- 마지막 한 문장은 지금 기분이나 다음에 하고 싶은 일입니다.\n\n" +
    "사실:\n" + noteFacts(evts, delta, awayMs);
  sample(prompt, {
    modelTier: "default",
    onText: function(e){ box.classList.remove("blink"); box.textContent = e.text; }
  }).then(function(res){
    notePending = false;
    box.classList.remove("blink");
    box.parentElement.classList.remove("pending");
    box.textContent = res.text || fb;
    noteCache = { key:key, text:box.textContent };
  }).catch(function(err){
    notePending = false;
    box.classList.remove("blink");
    box.parentElement.classList.remove("pending");
    box.textContent = (err && err.text) ? err.text : fb;
    noteCache = { key:key, text:box.textContent };
  });
}

  }
  h += '</div>';
  if (!S.events.length) h += '<p class="empty">아직 기록이 없어요. 첫걸음까지 5분.</p>';
  v.innerHTML = h;
}

/* ── 정비 ─────────────────────────────────────────────── */
var SUPPLY_COOL = 72; // 6시간
function renderRig(){
  var v = $("view-rig"), nt = nowTick();
  var h = '<p class="eyebrow">길드 방침</p>';
  h += '<h2 class="head">무엇을 우선할까요</h2>';
  h += '<p class="sub">방침은 지금 이후의 걸음부터 적용됩니다. 이미 지나간 시간은 바뀌지 않아요.</p>';
  h += '<div class="opts">';
  for (var key in DIRECTIVES){
    var d = DIRECTIVES[key];
    h += '<button class="opt" data-dir="' + key + '" aria-pressed="' + (S.dir === key) + '">'
      + '<span class="k">' + d.k + '</span><span><strong>' + esc(d.name) + '</strong><span>' + esc(d.desc) + '</span></span></button>';
  }
  h += '</div>';

  h += '<p class="eyebrow">강화 · 보유 골드 <span class="mono" style="color:var(--accent)">' + S.scrap + '</span></p>';
  for (var i = 0; i < UPGRADES.length; i++){
    var u = UPGRADES[i], lv = S.up[u.id], c = upCost(lv), can = S.scrap >= c;
    h += '<div class="rigrow"><div class="t"><strong>' + esc(u.name) + '<span class="lv">' + lv + '강</span></strong>'
      + '<span class="d">' + esc(u.desc) + '</span></div>'
      + '<button class="buy" data-up="' + u.id + '"' + (can ? "" : " disabled") + '>강화 <b>' + c + '</b></button></div>';
  }

  var cool = nt - (save.supplyAt || -9999);
  var ready = cool >= SUPPLY_COOL;
  h += '<div class="rigrow"><div class="t"><strong>소포 보내기</strong><span class="d">도시락 소포예요. 기력을 가득 채우고 체력을 35% 회복합니다'
    + (ready ? "" : " · " + dur((SUPPLY_COOL - cool) * TICK_MS) + " 후 가능") + '</span></div>'
    + '<button class="buy" id="supplyBtn"' + (ready ? "" : " disabled") + '>보내기</button></div>';

  h += '<p class="eyebrow" style="margin-top:26px">발굴한 보물 · ' + S.relics.length + '</p>';
  if (S.relics.length){
    h += '<div class="relics">';
    for (var r = 0; r < S.relics.length; r++) h += '<span class="relic"><b>' + esc(S.relics[r]) + '</b></span>';
    h += '</div>';
  } else h += '<p class="empty">아직 보물을 못 찾았어요. 드릴을 강화해 보세요.</p>';

  h += '<p class="eyebrow">이름</p><div class="namefield"><input id="nameIn" maxlength="14" value="' + esc(save.name) + '"><button class="ghost" id="nameSave">변경</button></div>';
  h += '<p class="warnline">기록은 이 아티팩트에 저장됩니다. 앱을 닫아도, 폰을 바꿔도 같은 계정이면 같은 모험가를 만나요.<br>'
    + '모험 시작 후 ' + esc(dur(Date.now() - save.startedAt)) + ' · 총 ' + nt + '걸음 · 모험가 수첩 <span class="mono">' + save.desig.replace(/^KX-/, "No.") + '-' + save.seed.toString(16).toUpperCase() + '</span></p>';
  v.innerHTML = h;

  var opts = v.querySelectorAll("[data-dir]");
  for (var o = 0; o < opts.length; o++) opts[o].onclick = function(){
    save.acts.push({ t: nowTick(), k: "dir", v: this.getAttribute("data-dir") });
    persist(); refresh(true); toast("방침을 전했습니다.");
  };
  var buys = v.querySelectorAll("[data-up]");
  for (var b = 0; b < buys.length; b++) buys[b].onclick = function(){
    var id = this.getAttribute("data-up");
    if (S.scrap < upCost(S.up[id])) return;
    save.acts.push({ t: nowTick(), k: "up", v: id });
    persist(); refresh(true); toast("강화를 맡겼습니다.");
  };
  if (ready) $("supplyBtn").onclick = function(){
    save.supplyAt = nowTick();
    save.acts.push({ t: nowTick(), k: "supply" });
    persist(); refresh(true); toast("소포를 보냈습니다.");
  };
  $("nameSave").onclick = function(){
    var n = $("nameIn").value.trim();
    if (!n) return;
    save.name = n.slice(0, 14); persist(); refresh(true); toast("이름을 바꿨습니다.");
  };
}

/* ── 영지 ─────────────────────────────────────────────── */
function nextWaveIn(nt){
  if (!S.est.on) return 0;
  var next = S.est.t0 + (Math.floor((nt - S.est.t0) / WAVE_EVERY) + 1) * WAVE_EVERY;
  return (next - nt) * 5;
}
function renderEstate(){
  var v = $("view-estate"), nt = nowTick(), h = "";
  if (!S.est.on){
    h += '<p class="eyebrow">영지 개척</p>';
    h += '<h2 class="head">마을 어귀, 언덕 하나가<br>비어 있습니다.</h2>';
    h += '<p class="sub">깃발을 꽂으면 당신의 영지가 됩니다. 몬스터가 시간마다 몰려오지만, 성벽과 탑이 당신 대신 싸워요 — 자는 동안에도.</p>';
    h += '<div class="gains">'
      + '<span class="gain">개척 비용 <b>골드 ' + FOUND_COST + '</b></span>'
      + '<span class="gain">보유 <b>' + S.scrap + '</b></span></div>';
    h += '<button class="ack" id="foundBtn"' + (S.scrap >= FOUND_COST ? "" : " disabled") + '>'
      + (S.scrap >= FOUND_COST ? "이 언덕에 깃발을 꽂는다" : "골드 " + FOUND_COST + "가 모이면 개척할 수 있어요") + '</button>';
    h += '<p class="warnline">개척하면 성벽 1단계가 함께 세워지고, 한 시간 뒤 첫 습격이 옵니다.</p>';
    v.innerHTML = h;
    var fb = $("foundBtn");
    if (S.scrap >= FOUND_COST) fb.onclick = function(){
      save.acts.push({ t: nowTick(), k: "found" });
      persist(); refresh(true); renderEstate(); toast("영지를 개척했습니다!");
    };
    return;
  }

  var e = S.est, ename = save.ename || save.name + "의 영지";
  var wallPct = Math.max(0, Math.min(100, Math.round(e.wallHp / e.wallMax * 100)));
  var nextP = Math.round(wavePow(e.waves + 1));
  h += '<p class="eyebrow">영지 전황</p>';
  h += '<h2 class="head">' + esc(ename) + '</h2>';
  h += '<p class="sub">다음 습격까지 약 ' + nextWaveIn(nt) + '분 · 예상 전력 ' + nextP
    + ' vs 우리 방어 <span class="mono" style="color:var(--accent)">' + e.defPow + '</span></p>';
  h += '<div style="margin:0 0 6px;display:flex;justify-content:space-between;font-size:11px;color:var(--faint)"><span>성벽 내구</span><span class="mono">' + e.wallHp + '/' + e.wallMax + '</span></div>';
  h += '<div class="bar hp' + (wallPct < 35 ? " low" : "") + '" style="height:5px;margin-bottom:16px"><i style="width:' + wallPct + '%"></i></div>';
  h += '<div class="gains" style="border-top:1px solid var(--line)">'
    + '<span class="gain">습격 <b>' + e.waves + '</b></span>'
    + '<span class="gain up">격퇴 <b>' + e.repelled + '</b></span>'
    + '<span class="gain">돌파당함 <b>' + e.breached + '</b></span>'
    + '<span class="gain">농장 수입 <b>' + e.farmGold + '</b></span></div>';

  h += '<p class="eyebrow" style="margin-top:24px">수련 · 포인트 <span class="mono" style="color:var(--accent)">' + e.ptsFree + '</span> <span style="letter-spacing:0;text-transform:none">(격퇴 4회마다 +1)</span></p>';
  for (var i = 0; i < STATS.length; i++){
    var st = STATS[i];
    h += '<div class="rigrow"><div class="t"><strong>' + st.name + '<span class="lv">' + e.st[st.id] + '</span></strong>'
      + '<span class="d">' + st.desc + '</span></div>'
      + '<button class="buy" data-st="' + st.id + '"' + (e.ptsFree > 0 ? "" : " disabled") + '>수련</button></div>';
  }

  h += '<p class="eyebrow" style="margin-top:24px">건설 · 보유 골드 <span class="mono" style="color:var(--accent)">' + S.scrap + '</span></p>';
  for (var b = 0; b < BUILDINGS.length; b++){
    var bd = BUILDINGS[b], lv = e.bld[bd.id], c = bldCost(bd.id, lv);
    h += '<div class="rigrow"><div class="t"><strong>' + bd.name + '<span class="lv">' + lv + '단계</span></strong>'
      + '<span class="d">' + bd.desc + '</span></div>'
      + '<button class="buy" data-bld="' + bd.id + '"' + (S.scrap >= c ? "" : " disabled") + '>건설 <b>' + c + '</b></button></div>';
  }

  h += '<p class="eyebrow" style="margin-top:24px">영지 이름</p><div class="namefield"><input id="enameIn" maxlength="16" value="' + esc(ename) + '"><button class="ghost" id="enameSave">변경</button></div>';
  v.innerHTML = h;

  var sts = v.querySelectorAll("[data-st]");
  for (var q = 0; q < sts.length; q++) sts[q].onclick = function(){
    if (S.est.ptsFree < 1) return;
    save.acts.push({ t: nowTick(), k: "st", v: this.getAttribute("data-st") });
    persist(); refresh(true); renderEstate(); toast("수련을 마쳤습니다.");
  };
  var blds = v.querySelectorAll("[data-bld]");
  for (var w = 0; w < blds.length; w++) blds[w].onclick = function(){
    var id = this.getAttribute("data-bld");
    if (S.scrap < bldCost(id, S.est.bld[id])) return;
    save.acts.push({ t: nowTick(), k: "b", v: id });
    persist(); refresh(true); renderEstate(); toast("건설을 지시했습니다.");
  };
  $("enameSave").onclick = function(){
    var n = $("enameIn").value.trim();
    if (!n) return;
    save.ename = n.slice(0, 16); persist(); renderEstate(); toast("영지 이름을 바꿨습니다.");
  };
}

/* ── 귓속말 ─────────────────────────────────────────────── */
function renderChat(){
  var c = $("chat");
  if (!chat.turns.length){
    c.innerHTML = '<div class="bub it"><div class="who">' + esc(save.name)
      + '</div><div class="body">길드장님! 부르셨어요? 여기 이야기라면 얼마든지 들려드릴게요.</div></div>';
    return;
  }
  var h = "";
  for (var i = 0; i < chat.turns.length; i++){
    var t = chat.turns[i];
    h += '<div class="bub ' + (t.r === "u" ? "me" : "it") + '"><div class="who">'
      + (t.r === "u" ? "길드장" : esc(save.name)) + '</div><div class="body">' + esc(t.x) + '</div></div>';
  }
  c.innerHTML = h;
  c.lastElementChild.scrollIntoView({ block: "end" });
}

function chatRules(){
  var recent = S.events.slice(-14).map(function(e){
    return "- " + clock(e.t) + " " + String(e.x).replace(/<[^>]+>/g, "");
  }).join("\n");
  return "당신은 방치형 모험 게임 속 '모험가'입니다. 이 대화 전체에서 그 인격을 유지하십시오.\n\n" +
    "정체성: 이름은 '" + save.name + "'(모험가 수첩 " + save.desig.replace("KX-", "No.") + "). 초보자 마을에서 출발해 점점 먼 지방까지 여행하는 신출내기 모험가입니다. " +
    "상대는 멀리서 귓속말로만 이어지는 '길드장님'이고, 당신은 길드장님을 잘 따르지만 그분이 늘 바쁘다는 것도 압니다.\n" +
    "말투: 한국어 존댓말. 씩씩하고 조금 수다스럽게, 2~5문장. 겪은 일을 신나게 이야기하고 가끔 속마음을 한 문장 덧붙입니다. " +
    "이모지·목록·머리말 없이 말만 합니다.\n" +
    "한계: 이 모험 세계 밖(현실 뉴스, 게임 시스템 용어)은 모릅니다. 모르는 것은 모른다고 말합니다. " +
    "길드장님이 방침을 바꾸자고 하면 '가방' 화면에서 정해 달라고 안내합니다. 없는 사건을 지어내지 마십시오.\n\n" +
    "지금 상태:\n" +
    "- 위치: " + S.locName + " (여정 " + S.depth + ")\n" +
    "- 체력 " + S.hp + "/" + S.maxHp + ", 기력 " + S.charge + "/" + S.maxCharge + ", LV " + S.level + ", 골드 " + S.scrap + "\n" +
    "- 현재 방침: " + DIRECTIVES[S.dir].name + "\n" +
    "- 지금까지: 이동 " + S.moves + "회, 전투 " + S.fights + "회, 패배 " + S.retreats + "회, 보물 " + S.relics.length + "점\n" +
    "- 가진 보물: " + (S.relics.length ? S.relics.join(", ") : "아직 없음") + "\n" +
    (S.est.on
      ? "- 영지 '" + (save.ename || save.name + "의 영지") + "': 성벽 " + S.est.wallHp + "/" + S.est.wallMax + ", 방어 전력 " + S.est.defPow + ", 습격 " + S.est.waves + "회 중 격퇴 " + S.est.repelled + "·돌파당함 " + S.est.breached + "\n"
      : "- 영지: 아직 개척 전 (길드장님이 '영지' 화면에서 개척할 수 있음)\n") +
    "- 모험 시작 후 " + dur(Date.now() - save.startedAt) + " 경과\n\n" +
    "최근 일지:\n" + (recent || "- (아직 기록 없음)") + "\n\n이제 길드장님의 귓속말에 답하십시오.";
}

var talking = false;
function sendMsg(){
  var box = $("say"), msg = box.value.trim();
  if (!msg || talking) return;
  if (!sample){ toast("이 화면에서는 귓속말이 닿지 않아요."); return; }
  box.value = "";
  chat.turns.push({ r: "u", x: msg });
  renderChat(); persist();

  talking = true; $("send").disabled = true;
  var c = $("chat");
  var bub = document.createElement("div");
  bub.className = "bub it";
  bub.innerHTML = '<div class="who">' + esc(save.name) + '</div><div class="body blink"></div>';
  c.appendChild(bub);
  var body = bub.lastElementChild;
  bub.scrollIntoView({ block: "end" });

  var hist = chat.turns.slice(-14);
  var input = [{ role: "user", content: chatRules() }];
  for (var i = 0; i < hist.length; i++){
    if (hist[i].r === "u") input.push({ role: "user", content: hist[i].x });
    else input.push({ role: "assistant", content: hist[i].x });
  }
  if (input[input.length - 1].role !== "user") input.push({ role: "user", content: "…" });

  sample(input, {
    cache: false,
    onText: function(e){ body.classList.remove("blink"); body.textContent = e.text; bub.scrollIntoView({ block: "end" }); }
  }).then(function(res){
    talking = false; $("send").disabled = false;
    chat.turns.push({ r: "a", x: res.text });
    if (chat.turns.length > 60) chat.turns = chat.turns.slice(-60);
    persist(); renderChat();
  }).catch(function(err){
    talking = false; $("send").disabled = false;
    body.classList.remove("blink");
    var code = err && err.code;
    var msgs = {
      not_granted:"귓속말 허가가 없어요. 이 아티팩트에 Claude 사용을 허용하면 열려요.",
      rate_limited:"지금은 귓속말이 붐벼요. 잠시 뒤에 다시 불러 주세요.",
      session_expired:"로그인이 풀렸어요. 다시 로그인하고 불러 주세요.",
      refused:"그 말에는 답하기 어려워요. 다르게 물어봐 주세요.",
      cancelled:"귓속말이 끊겼어요."
    };
    if (err && err.text){
      body.textContent = err.text;
      chat.turns.push({ r: "a", x: err.text });
      persist();
    } else {
      body.textContent = msgs[code] || "귓속말이 닿지 않았어요. 잠시 뒤에 다시 보내 주세요.";
      bub.classList.add("err");
    }
  });
}

/* ── 탭 ───────────────────────────────────────────────── */
var TABS = ["brief", "log", "talk", "estate", "rig"];
var active = "brief";
function show(name){
  active = name;
  for (var i = 0; i < TABS.length; i++){
    var t = TABS[i];
    $("tab-" + t).setAttribute("aria-selected", String(t === name));
    $("view-" + t).hidden = (t !== name);
  }
  if (name === "log") renderLog();
  if (name === "rig") renderRig();
  if (name === "estate") renderEstate();
  if (name === "talk"){ renderChat(); }
  if (name === "brief") renderBrief();
  window.scrollTo(0, 0);
}

/* ── 갱신 ─────────────────────────────────────────────── */
var lastTick = -1;
function refresh(force){
  var nt = nowTick();
  S = simulate(save, nt);
  S0 = simulate(save, Math.min(save.ack || 0, nt));
  renderHud();
  drawWave();
  var ackT = save.ack || 0;
  $("briefDot").hidden = !(nt - ackT >= 4 && S.events.some(function(e){ return e.t > ackT; }));
  if (force || nt !== lastTick){
    if (active === "log") renderLog();
    if (active === "rig") renderRig();
    if (active === "estate") renderEstate();
    if (force && active === "brief") renderBrief();
  }
  lastTick = nt;
}

/* ── 기동 ─────────────────────────────────────────────── */
function start(){
  $("load").hidden = true;
  $("boot").hidden = true;
  $("app").hidden = false;
  refresh(true);
  show("brief");
  waveLoop();
  setInterval(function(){ refresh(false); }, 15000);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) refresh(true);
  });
}

function boot(){
  var names = ["초", "여울", "다온", "미르", "노을", "가람", "해리", "이레"];
  $("bootName").value = names[Math.floor(Math.random() * names.length)];
  $("load").hidden = true;
  $("boot").hidden = false;
  $("bootGo").onclick = function(){
    var n = $("bootName").value.trim() || "모험가";
    save = newSave(n.slice(0, 14));
    chat = { turns: [] };
    persist();
    start();
  };
  $("bootName").addEventListener("keydown", function(e){ if (e.key === "Enter") $("bootGo").click(); });
}

/* ── 초기화 ───────────────────────────────────────────── */
$("send").onclick = sendMsg;
$("say").addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMsg(); }
});
$("say").addEventListener("input", function(){
  this.style.height = "44px";
  this.style.height = Math.min(120, this.scrollHeight) + "px";
});
for (var i = 0; i < TABS.length; i++){
  (function(t){ $("tab-" + t).onclick = function(){ show(t); }; })(TABS[i]);
}
window.addEventListener("resize", function(){ drawWave(); });

(async function init(){
  var local = lsGet(LS_KEY);
  var started = false;
  if (local && local.save && local.save.seed !== undefined){
    save = local.save; chat = local.chat || { turns: [] };
    if (!save.acts) save.acts = [{ t: 0, k: "dir", v: "explore" }];
    start(); started = true;                 // 저장본이 있으면 기다리지 않고 바로 콘솔로
  }

  try { db = await claude.use("db"); } catch (e) { db = null; }
  try { sample = await claude.use("sample"); } catch (e) { sample = null; }

  if (db){
    try {
      var snap = await db.doc("save/main").get();
      if (snap.exists){
        var remote = snap.data();
        if (remote && remote.seed !== undefined && (!save || remote.startedAt <= save.startedAt)) save = remote;
        if (!save.acts) save.acts = [{ t: 0, k: "dir", v: "explore" }];
      }
      var csnap = await db.doc("save/chat").get();
      if (csnap.exists){
        var rc = csnap.data();
        if (rc && rc.turns && rc.turns.length >= chat.turns.length) chat = { turns: rc.turns };
      }
    } catch (e) {}
  }

  if (save && save.seed !== undefined){
    if (db) persist();
    if (started) refresh(true); else start();
  } else if (!started){
    boot();
  }
})();
})();
</script>
